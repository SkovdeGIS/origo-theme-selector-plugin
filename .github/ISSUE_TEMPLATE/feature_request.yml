name: Feature request
description: Suggest a focused improvement to Origo Theme Selector.
body:
  - type: markdown
    attributes:
      value: Swedish or English is fine. Describe the need before the implementation.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who needs this and in which map workflow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired behavior
      description: A short example or proposed configuration helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or current workaround
    validations:
      required: false
