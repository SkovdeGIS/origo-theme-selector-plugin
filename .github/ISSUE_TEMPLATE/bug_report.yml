name: Bug report
description: Report a reproducible problem with Origo Theme Selector.
body:
  - type: markdown
    attributes:
      value: |
        Swedish or English is fine. Use a minimal example and remove private
        service URLs, credentials and personal data before posting.
  - type: input
    id: origo-version
    attributes:
      label: Origo version
      description: Include a commit ID if using a development build.
      placeholder: 2.11.0-dev, commit 728cbc6
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Theme Selector version
      description: Release version or commit/revision from which the files were copied.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Browser name/version and OS
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Relevant theme configuration
      description: Include related layer/group definitions if needed to reproduce it.
      render: javascript
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the initial state and any manual layer/background changes.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant console warnings/errors or screenshots if useful.
    validations:
      required: true
